version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: raizes_nordeste_db
    restart: always
    environment:
      POSTGRES_DB: raizes_nordeste_db
      POSTGRES_USER: raizes_user
      POSTGRES_PASSWORD: raizes_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - raizes-net

networks:
  raizes-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
